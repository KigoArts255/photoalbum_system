    <script>
        // 1. Array array matching your local storage file structures
        const galleryImages = [
            "love/swammyjeffer.jpg",
            // Drop additional relative strings below as needed:
            // "love/photo2.jpg",
            // "love/photo3.jpg"
        ];

        // Track state index
        let currentIndex = 0;

        // Cache layout DOM nodes
        const activePhoto = document.getElementById('activePhoto');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const galleryStage = document.getElementById('galleryStage');
        
        const lightbox = document.getElementById('lightbox');
        const fullSizeImage = document.getElementById('fullSizeImage');
        const closeLightbox = document.getElementById('closeLightbox');

        // Function updates rendering target paths smoothly
        function updateGalleryView(index) {
            activePhoto.src = galleryImages[index];
        }

        // Next item transition logic
        nextBtn.addEventListener('click', () => {
            currentIndex++;
            if (currentIndex >= galleryImages.length) {
                currentIndex = 0; // Seamless loop reset back to start index
            }
            updateGalleryView(currentIndex);
        });

        // Previous item transition logic
        prevBtn.addEventListener('click', () => {
            currentIndex--;
            if (currentIndex < 0) {
                currentIndex = galleryImages.length - 1; // Seamless loop jump to end item index
            }
            updateGalleryView(currentIndex);
        });

        // 2. Full-Size Modal Lightbox Engine Rules
        galleryStage.addEventListener('click', () => {
            // Source link updates directly to current slide paths
            fullSizeImage.src = activePhoto.src;
            lightbox.classList.add('show');
        });

        // Dismiss frame via close token button
        closeLightbox.addEventListener('click', () => {
            lightbox.classList.remove('show');
        });

        // Dismiss frame instantly if user clicks out over the blurred dark background
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                lightbox.classList.remove('show');
            }
        });

        // Keyboard accessibility: press ESC key to close full view mode easily
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && lightbox.classList.contains('show')) {
                lightbox.classList.remove('show');
            }
        });
    </script>
